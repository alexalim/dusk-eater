# Signed build uploaded to TestFlight. Run manually from the Actions tab.
# Signing follows the same manual scheme as the team's other apps:
# one Apple Distribution certificate (.p12) + an App Store profile per app.
#
# Repository secrets:
#   DIST_P12_BASE64     base64 of the Apple Distribution .p12
#   DIST_P12_PASSWORD   password of that .p12
#   PROFILE_BASE64      base64 of the "DuskEater_AppStore" .mobileprovision
#   ASC_KEY_P8          App Store Connect API key (.p8 contents)
#   ASC_KEY_ID          App Store Connect API key ID
#   ASC_ISSUER_ID       App Store Connect issuer ID
# Repository variable:
#   APPLE_TEAM_ID       Apple team ID
name: TestFlight

on:
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    runs-on: macos-26
    timeout-minutes: 45
    permissions:
      contents: write # release.json on the `release` branch (the app's update check)
    env:
      KEYCHAIN: build.keychain-db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check secrets
        run: |
          missing=""
          [ -z "${{ secrets.DIST_P12_BASE64 }}" ] && missing="$missing DIST_P12_BASE64"
          [ -z "${{ secrets.DIST_P12_PASSWORD }}" ] && missing="$missing DIST_P12_PASSWORD"
          [ -z "${{ secrets.PROFILE_BASE64 }}" ] && missing="$missing PROFILE_BASE64"
          [ -z "${{ secrets.ASC_KEY_P8 }}" ] && missing="$missing ASC_KEY_P8"
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Select newest Xcode 26
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Copy web assets into the iOS project
        run: npx cap sync ios

      - name: Install certificate and profile (temporary keychain)
        env:
          P12_BASE64: ${{ secrets.DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.PROFILE_BASE64 }}
        run: |
          KC_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$KC_PASS"
          echo "KC_PASS=$KC_PASS" >> "$GITHUB_ENV"

          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$KC_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KC_PASS" "$KEYCHAIN"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$KEYCHAIN"

          echo "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          uuid=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$RUNNER_TEMP/app.mobileprovision" "$dir/$uuid.mobileprovision"
          done

      # Release signing settings live in the App target (manual, Apple Distribution,
      # profile DuskEater_AppStore) so they don't leak into Swift package targets.
      - name: Archive (signed)
        working-directory: ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            archive

      - name: Upload to TestFlight
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ vars.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.aspynlim.duskeater</key><string>DuskEater_AppStore</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}"

      # The app compares its build with this file at start (www/update.js) and offers the update. `min` (oldest build still
      # allowed) and `url` are kept from the previous file: edit them on the `release` branch by hand when needed.
      # availableAt is 20 minutes out so phones only hear about the build once Apple has processed it.
      - name: Publish release.json for the in-app update check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BUILD: ${{ github.run_number }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$RUNNER_TEMP/App.xcarchive/Products/Applications/App.app/Info.plist")
          cur=$(gh api "repos/$REPO/contents/release.json?ref=release" 2>/dev/null || echo '{}')
          sha=$(printf '%s' "$cur" | jq -r '.sha // empty')
          prev=$(printf '%s' "$cur" | jq -r '.content // empty' | base64 --decode 2>/dev/null); [ -n "$prev" ] || prev='{}'
          at=$(date -u -v+20M +%Y-%m-%dT%H:%M:%SZ)
          new=$(printf '%s' "$prev" | jq --argjson b "$BUILD" --arg v "$VERSION" --arg at "$at" \
            '.ios = ((.ios // {}) + {build: $b, version: $v, availableAt: $at}) | .ios.min = (.ios.min // 0) | .ios.url = (.ios.url // "itms-beta://beta.itunes.apple.com/v1/app/6828737098")')
          printf '%s\n' "$new"
          if git ls-remote --exit-code --heads origin release > /dev/null; then
            gh api -X PUT "repos/$REPO/contents/release.json" -f branch=release -f message="[chore] release.json: build $BUILD" \
              -f content="$(printf '%s\n' "$new" | base64)" ${sha:+-f sha=$sha} > /dev/null
          else # first time: an orphan branch holding only this file
            blob=$(printf '%s\n' "$new" | git hash-object -w --stdin)
            tree=$(printf '100644 blob %s\trelease.json\n' "$blob" | git mktree)
            c=$(git -c user.name=github-actions -c user.email=github-actions@github.com commit-tree "$tree" -m "[chore] release.json: build $BUILD")
            git push origin "$c:refs/heads/release"
          fi

      - name: Clean up keychain and key files
        if: always()
        run: |
          security delete-keychain "$KEYCHAIN" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/app.mobileprovision"
